<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    * { box-sizing: border-box; margin: 0; padding: 0; }

    .header-title { font-weight: 800; font-size: 1.05rem; color: #1a4f6e; display: flex; align-items: center; gap: 0.5rem; }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; }

    .btn { padding: 0.42rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.18s; font-family: inherit; }
    .btn-primary  { background: #1a7fbf; color: white; }
    .btn-primary:hover { background: #1565a0; }
    .btn-secondary { background: #e6f5fb; color: #1a4f6e; border: 1.5px solid #c9eef8; }
    .btn-secondary:hover { background: #c9eef8; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .btn-success:hover { background: #a7f3d0; }
    .btn-sm { padding: 0.28rem 0.65rem; font-size: 0.78rem; }
    .btn-purple { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }
    .btn-purple:hover { background: #ddd6fe; }

    .app-layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: 196px; background: white; border-right: 1.5px solid #c9eef8; padding: 1rem 0; overflow-y: auto; flex-shrink: 0; }
    .sidebar-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.07em; color: #a0c4d8; padding: 0 1.1rem; margin-bottom: 0.4rem; margin-top: 1.1rem; text-transform: uppercase; }
    .sidebar-label:first-child { margin-top: 0; }
    .sidebar-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 1.1rem; cursor: pointer; font-size: 0.88rem; color: #2a6e8a; transition: all 0.15s; border-right: 3px solid transparent; }
    .sidebar-item:hover { background: #f0f9ff; }
    .sidebar-item.active { background: #e6f5fb; color: #1a4f6e; font-weight: 700; border-right-color: #1a7fbf; }

    .main-content { flex: 1; overflow-y: auto; padding: 2rem 2.2rem; }
    .section-editor { max-width: 800px; }
    .section-editor-title { font-size: 1.25rem; font-weight: 800; color: #1a4f6e; margin-bottom: 0.3rem; }
    .section-editor-desc { font-size: 0.83rem; color: #5badd4; margin-bottom: 1.8rem; }

    .card { background: white; border: 1.5px solid #c9eef8; border-radius: 12px; padding: 1.15rem 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.7rem; border-bottom: 1px solid #e6f5fb; }
    .card-title { font-weight: 700; font-size: 0.93rem; color: #1a4f6e; }
    .card-actions { display: flex; gap: 0.45rem; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label { display: block; font-size: 0.79rem; font-weight: 700; color: #2a6e8a; margin-bottom: 0.35rem; }
    input[type="text"], input[type="number"], input[type="url"], textarea, select { width: 100%; padding: 0.55rem 0.8rem; border: 1.5px solid #c9eef8; border-radius: 8px; font-size: 0.88rem; color: #1a4f6e; font-family: inherit; background: white; transition: border-color 0.15s; }
    input[type="text"]:focus, textarea:focus, select:focus, input[type="url"]:focus { outline: none; border-color: #5badd4; }
    textarea { resize: vertical; min-height: 72px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }

    .list-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.9rem; background: #f0f9ff; border: 1px solid #c9eef8; border-radius: 8px; margin-bottom: 0.45rem; }
    .list-item-content { flex: 1; min-width: 0; }
    .list-item-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

    .add-btn { display: flex; align-items: center; justify-content: center; gap: 0.4rem; width: 100%; padding: 0.6rem; border: 2px dashed #c9eef8; border-radius: 10px; background: transparent; color: #5badd4; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.4rem; font-family: inherit; }
    .add-btn:hover { border-color: #5badd4; background: #f0f9ff; color: #1a7fbf; }

    .range-row { display: flex; align-items: center; gap: 0.8rem; }
    .range-row input[type="range"] { flex: 1; accent-color: #1a7fbf; padding: 0; border: none; }
    .range-val { width: 38px; text-align: center; font-weight: 700; color: #1a7fbf; font-size: 0.88rem; flex-shrink: 0; }
    .gauge-preview { height: 7px; background: #c9eef8; border-radius: 999px; overflow: hidden; margin-top: 0.55rem; }
    .gauge-preview-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #1a7fbf, #6cc6e8); transition: width 0.25s; }

    .ci-editor { background: #f8fcff; border: 1px solid #d8eef8; border-radius: 8px; margin-bottom: 0.45rem; overflow: hidden; }
    .ci-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.58rem 0.85rem; cursor: pointer; user-select: none; }
    .ci-header:hover { background: #eef7fd; }
    .ci-title { flex: 1; font-size: 0.86rem; font-weight: 600; color: #1a4f6e; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ci-year  { font-size: 0.78rem; color: #5badd4; font-weight: 400; flex-shrink: 0; }
    .ci-body  { padding: 0 0.85rem 0.85rem; display: none; }
    .ci-body.open { display: block; }
    .ci-chevron { font-size: 0.75rem; color: #a0c4d8; flex-shrink: 0; transition: transform 0.2s; }
    .ci-header.open .ci-chevron { transform: rotate(180deg); }

    .tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.5rem; }
    .tag-chip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.18rem 0.6rem; border-radius: 999px; font-size: 0.76rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .tag-chip:hover { opacity: 0.7; }
    .tag-chip-blue   { background: #dbeafe; color: #1d4ed8; }
    .tag-chip-green  { background: #d1fae5; color: #065f46; }
    .tag-chip-purple { background: #ede9fe; color: #5b21b6; }
    .tag-chip-orange { background: #ffedd5; color: #9a3412; }

    .tab-row { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }

    .info-banner { background: #e6f5fb; border: 1px solid #b8dff0; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.83rem; color: #2a6e8a; margin-bottom: 1.4rem; display: flex; align-items: flex-start; gap: 0.45rem; line-height: 1.6; }

    .dl-steps { background: white; border: 1.5px solid #c9eef8; border-radius: 12px; padding: 1.3rem 1.5rem; margin-bottom: 1.5rem; }
    .dl-steps h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; color: #1a4f6e; }
    .dl-step { display: flex; gap: 0.7rem; align-items: flex-start; margin-bottom: 0.7rem; font-size: 0.87rem; color: #2a6e8a; line-height: 1.6; }
    .dl-step:last-child { margin-bottom: 0; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: #1a7fbf; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; margin-top: 0.15rem; }
    code { background: #e6f5fb; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.82rem; font-family: monospace; }

    /* 모달 블록 에디터 */
    .modal-editor { background: #f5f0ff; border: 1.5px solid #ddd6fe; border-radius: 10px; padding: 1rem; margin-top: 0.8rem; }
    .modal-editor-title { font-size: 0.8rem; font-weight: 700; color: #5b21b6; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem; }
    .block-item { background: white; border: 1px solid #e9d5ff; border-radius: 8px; padding: 0.8rem; margin-bottom: 0.5rem; }
    .block-type-badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 4px; margin-bottom: 0.5rem; }
    .bt-subtitle  { background: #dbeafe; color: #1d4ed8; }
    .bt-paragraph { background: #f0fdf4; color: #065f46; }
    .bt-bullets   { background: #fef3c7; color: #92400e; }
    .bt-image     { background: #fce7f3; color: #9d174d; }
    .bt-link      { background: #ede9fe; color: #5b21b6; }
    .block-actions { display: flex; gap: 0.3rem; float: right; margin-top: -0.1rem; }

    .img-preview { max-width: 100%; max-height: 120px; border-radius: 6px; margin-top: 0.5rem; border: 1px solid #e9d5ff; }

    .toast { position: fixed; bottom: 1.8rem; right: 1.8rem; background: #1a4f6e; color: white; padding: 0.65rem 1.2rem; border-radius: 10px; font-size: 0.87rem; font-weight: 600; z-index: 9999; pointer-events: none; opacity: 0; transform: translateY(10px); transition: all 0.28s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .divider { height: 1px; background: #e6f5fb; margin: 1.2rem 0; }
  </style>
</head>

    <div class="sidebar-item"        id="tab-download"  onclick="showSection('download')">⬇ HTML 내보내기</div>
  </nav>
  <main class="main-content" id="main"></main>
</div>

let D = deepClone(DEFAULT);
let curSection = 'hero';
let skillsTab  = 'gauges';
let pendingImgTarget = null;      // {type:'block'|'cover'|'carousel', gi, ci, bi?, imgIdx?}
let pendingCoverTarget = null;    // {gi, ci} for card cover image upload
let pendingPubTarget = null;      // {pi} for publication thumbnail upload

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function saveToLocal() {
  localStorage.setItem('portfolioAdmin_v2', JSON.stringify(D));
  toast('💾 저장 완료!');
}
function loadFromLocal() {
  try { const s = localStorage.getItem('portfolioAdmin_v2'); if (s) D = JSON.parse(s); } catch(e){}
  if (!D.publications) D.publications = [];
}
function resetData() {
  if (!confirm('모든 변경사항을 초기값으로 되돌릴까요?')) return;
  D = deepClone(DEFAULT);
  localStorage.removeItem('portfolioAdmin_v2');
  render();
  toast('↺ 초기화 완료');
}
function toast(msg, dur=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function showSection(sec) {
  curSection = sec;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const t = document.getElementById('tab-' + sec);
  if (t) t.classList.add('active');
  render();
}
function render() {
  const main = document.getElementById('main');
  /* 열린 카드 ID 목록 저장 */
  const openIds = [...document.querySelectorAll('.ci-body.open')].map(el => el.id);
  switch(curSection) {
    case 'hero':      main.innerHTML = renderHero();      break;
    case 'career':    main.innerHTML = renderCareer();    break;
    case 'skills':    main.innerHTML = renderSkills();    break;
    case 'education': main.innerHTML = renderEdu();       break;
    case 'projects':  main.innerHTML = renderProjects();  break;
    case 'publications': main.innerHTML = renderPublications(); break;
    case 'download':  main.innerHTML = renderDownload();  break;
  }
  /* 열렸던 카드 복원 */
  openIds.forEach(id => {
    const body = document.getElementById(id);
    if (!body) return;
    body.classList.add('open');
    const header = body.previousElementSibling;
    if (header && header.classList.contains('ci-header')) header.classList.add('open');
  });
}

function openPubThumbUpload(pi) {
  pendingPubTarget = { pi };
  document.getElementById('pub-thumb-upload').click();
}
function handlePubThumbUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file || !pendingPubTarget) return;
  const { pi } = pendingPubTarget;
  const reader = new FileReader();
  reader.onload = function(e2) {
    D.publications[pi].thumb = e2.target.result;
    pendingPubTarget = null;
    render();
    toast('✅ 썸네일 사진 업로드 완료!');
  };
  reader.readAsDataURL(file);
}
function openPubPdfUpload(pi) {
  pendingPubTarget = { pi };
  document.getElementById('pub-pdf-upload').click();
}
function handlePubPdfUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file || !pendingPubTarget) return;
  const { pi } = pendingPubTarget;
  if (file.size > 15 * 1024 * 1024) {
    pendingPubTarget = null;
    return toast('❌ PDF 용량이 너무 커요 (15MB 이하로 올려주세요)', 3000);
  }
  const reader = new FileReader();
  reader.onload = function(e2) {
    D.publications[pi].pdf = e2.target.result;
    D.publications[pi].pdfName = file.name;
    pendingPubTarget = null;
    render();
    toast('✅ PDF 업로드 완료!');
  };
  reader.readAsDataURL(file);
}

function renderBlock(gi, ci, bi, blk) {
  const typeLabels = { subtitle:'소제목', paragraph:'문단', bullets:'목록', image:'이미지', carousel:'슬라이드', link:'링크' };
  const typeClass  = { subtitle:'bt-subtitle', paragraph:'bt-paragraph', bullets:'bt-bullets', image:'bt-image', carousel:'bt-image', link:'bt-link' };
  const actBtns = `
    <div class="block-actions">
      ${bi > 0 ? `<button class="btn btn-secondary btn-sm" onclick="swapBlock(${gi},${ci},${bi},${bi-1})">↑</button>` : ''}
      ${`<button class="btn btn-danger btn-sm" onclick="removeBlock(${gi},${ci},${bi})">✕</button>`}
    </div>`;

  if (blk.type === 'subtitle') return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      <textarea style="min-height:48px;" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].text=this.value">${e(blk.text||'')}</textarea>
    </div>`;

  if (blk.type === 'paragraph') return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      <textarea oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].text=this.value">${e(blk.text||'')}</textarea>
    </div>`;

  if (blk.type === 'bullets') {
    const items = blk.items || [];
    return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      ${items.map((it, ii) => `
        <div style="display:flex;gap:0.4rem;margin-bottom:0.35rem;align-items:flex-start;">
          <span style="margin-top:0.55rem;color:#5badd4;flex-shrink:0;">•</span>
          <textarea style="flex:1;min-height:44px;" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].items[${ii}]=this.value">${e(it)}</textarea>
          <button class="btn btn-danger btn-sm" style="margin-top:0.35rem;flex-shrink:0;" onclick="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].items.splice(${ii},1);render()">✕</button>
        </div>
      `).join('')}
      <button class="add-btn" style="margin-top:0.3rem;" onclick="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].items.push('');render()">+ 항목 추가</button>
    </div>`;
  }

  if (blk.type === 'image') {
    const imgSrc = blk.src || '';
    return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.4rem;">
        <button class="btn btn-sm" style="background:#fce7f3;color:#9d174d;border:1px solid #fbcfe8;" onclick="openImgUpload(${gi},${ci},${bi})">📷 이미지 업로드</button>
        ${imgSrc ? '<span style="font-size:0.78rem;color:#5badd4;">이미지 업로드됨 ✓</span>' : '<span style="font-size:0.78rem;color:#a0c4d8;">이미지를 선택해 주세요</span>'}
      </div>
      ${imgSrc ? `<img src="${imgSrc}" class="img-preview" alt="미리보기">` : ''}
      <div class="form-group" style="margin-bottom:0;margin-top:0.5rem;">
        <label class="form-label">캡션 (선택)</label>
        <input type="text" value="${e(blk.caption||'')}" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].caption=this.value" placeholder="이미지 설명 (선택사항)">
      </div>
    </div>`;
  }

  if (blk.type === 'carousel') {
    const imgs = blk.images || [];
    return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      <div style="font-size:0.78rem;color:#5badd4;margin-bottom:0.6rem;">📎 여러 장의 이미지를 슬라이드로 표시해요 (${imgs.length}장 업로드됨)</div>
      ${imgs.map((img, ii) => `
        <div style="display:flex;gap:0.5rem;align-items:flex-start;margin-bottom:0.6rem;padding:0.5rem;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;">
          <img src="${img.src}" style="width:72px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0;" alt="">
          <div style="flex:1;min-width:0;">
            <input type="text" value="${e(img.caption||'')}" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].images[${ii}].caption=this.value" placeholder="캡션 (선택)" style="margin-bottom:0.3rem;">

          <div style="display:flex;flex-direction:column;gap:0.25rem;flex-shrink:0;">

            ${ii < imgs.length-1 ? `<button class="btn btn-secondary btn-sm" onclick="swap(D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].images,${ii},${ii+1});render()">↓</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].images.splice(${ii},1);render()">✕</button>
          </div>
        </div>
      `).join('')}
      <button class="btn btn-sm" style="background:#fce7f3;color:#9d174d;border:1px solid #fbcfe8;margin-top:0.2rem;" onclick="openCarouselImgUpload(${gi},${ci},${bi})">📷 이미지 추가</button>

  if (blk.type === 'link') return `
    <div class="block-item">
      <span class="block-type-badge ${typeClass[blk.type]}">${typeLabels[blk.type]}</span>${actBtns}
      <div class="form-group" style="margin-bottom:0.5rem;">
        <label class="form-label">URL</label>
        <input type="url" value="${e(blk.href||'')}" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].href=this.value" placeholder="https://...">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">링크 텍스트</label>
        <input type="text" value="${e(blk.text||'')}" oninput="D.projects[${gi}].cards[${ci}].modal.blocks[${bi}].text=this.value" placeholder="🔗 바로가기 →">
      </div>
    </div>`;

  return '';
}

function addBlock(gi, ci, type) {
  if (!D.projects[gi].cards[ci].modal) D.projects[gi].cards[ci].modal = {period:'',blocks:[]};
  const defaults = {
    subtitle:  { type:'subtitle',  text:'' },
    paragraph: { type:'paragraph', text:'' },
    bullets:   { type:'bullets',   items:[''] },
    image:     { type:'image',     src:'', caption:'' },
    carousel:  { type:'carousel',  images:[] },
    link:      { type:'link',      href:'', text:'' }
  };
  D.projects[gi].cards[ci].modal.blocks.push(defaults[type]);

function removeBlock(gi, ci, bi) {
  D.projects[gi].cards[ci].modal.blocks.splice(bi, 1);

function swapBlock(gi, ci, bi, bj) {
  swap(D.projects[gi].cards[ci].modal.blocks, bi, bj);

function openCarouselImgUpload(gi, ci, bi) {

  document.getElementById('cover-img-upload').click();

  ev.target.value = '';

  const {gi, ci} = pendingCoverTarget;
  const reader = new FileReader();

function handleImgUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file || !pendingImgTarget) return;
  const target = pendingImgTarget;
  pendingImgTarget = null;
  const reader = new FileReader();
  reader.onload = function(e2) {

    render();
  };

}

function triggerDownload() { showSection('download'); setTimeout(() => document.getElementById('file-input').click(), 150); }

async function handleFile(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const status = document.getElementById('dl-status');
  if (status) status.textContent = '⏳ 처리 중...';
  try {
    const text = await file.text();
    const result = applyChanges(text);
    const blob = new Blob([result], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(a.href);
    if (status) status.textContent = '✅ 다운로드 완료!';
    toast('✅ index.html 다운로드 완료!');
  } catch(err) {
    console.error(err);
    if (status) status.textContent = '❌ 오류: ' + err.message;
    toast('❌ 오류: ' + err.message);
  }
}

/* ============================================================
   HTML GENERATION — 순수 문자열 치환 (DOMParser 미사용)
   ============================================================ */

/* <section id="ID"> ... </section> 의 내부 innerHTML만 교체 */
function replaceSectionContent(html, id, newContent) {
  const re = new RegExp('<section([^>]*)id="' + id + '"([^>]*)>');
  const m  = re.exec(html);
  if (!m) return html;
  const tagEnd  = m.index + m[0].length;
  const closeIdx = html.indexOf('</section>', tagEnd);
  if (closeIdx === -1) return html;
  return html.substring(0, tagEnd) + newContent + html.substring(closeIdx);
}

/* .hero-inner 안의 텍스트 div를 교체하고 프로필 <img>는 보존 */
function replaceHeroText(html) {
  const marker   = 'class="hero-inner">';
  const heroPos  = html.indexOf(marker);
  if (heroPos === -1) return html;
  const contentStart = heroPos + marker.length;

  /* hero 안의 첫 <img = 프로필 사진 위치 */
  const nextSection = html.indexOf('<section', contentStart);
  const limit       = nextSection !== -1 ? nextSection : contentStart + 60000;
  const imgPos      = html.indexOf('<img ', contentStart);
  if (imgPos === -1 || imgPos > limit) return html;

  return html.substring(0, contentStart) + '\n' + genHeroText() + '\n    ' + html.substring(imgPos);
}

/* 기존 index.html에서 모달 HTML + 원본 스크립트 블록을 추출 */
function extractExistingModals(html) {
  const marker = '<!-- MODALS -->';
  const midx = html.indexOf(marker);
  if (midx === -1) return { modals: {}, script: '' };
  const bidx = html.lastIndexOf('</body>');
  const section = html.substring(midx + marker.length, bidx);

  // 원본 <script> 블록 통째로 보존 (슬라이드쇼·게이지 함수 + openModal 등)
  const scriptStart = section.lastIndexOf('<script>');
  const originalScript = scriptStart !== -1 ? section.substring(scriptStart) : '';

  // 모달 div들을 카드 ID 기준으로 추출 (script 블록 제외)
  const modalsSection = scriptStart !== -1 ? section.substring(0, scriptStart) : section;
  const modals = {};
  const parts = modalsSection.split('<div class="modal-overlay"');
  for (let i = 1; i < parts.length; i++) {
    const chunk = ('<div class="modal-overlay"' + parts[i]).trim();
    const idM = /id="modal-([^"]+)"/.exec(chunk);
    if (idM) modals[idM[1]] = chunk;
  }
  return { modals, script: originalScript };
}

function applyChanges(html) {
  /* ① 원본 모달 HTML + 슬라이드쇼 스크립트 먼저 추출 */
  const { modals: existingModals, script: originalScript } = extractExistingModals(html);

  /* ② 각 섹션 순수 문자열 교체 */
  html = replaceSectionContent(html, 'career',    genCareer());
  html = replaceSectionContent(html, 'skills',    genSkills());
  html = replaceSectionContent(html, 'education', genEducation());
  html = replaceSectionContent(html, 'projects',  genProjects());
  html = replaceSectionContent(html, 'publications', genPublications());

  /* ③ Hero 텍스트 교체 (프로필 사진 보존) */
  html = replaceHeroText(html);

  /* ④ 모달 교체 — 기존 HTML 보존, 원본 스크립트도 보존, 새 카드만 생성 */
  const midx = html.indexOf('<!-- MODALS -->');
  const bidx = html.lastIndexOf('</body>');
  if (midx !== -1 && bidx !== -1 && midx < bidx) {
    html = html.substring(0, midx) + '<!-- MODALS -->\n' + genModalsPreserving(existingModals, originalScript) + '\n' + html.substring(bidx);
  }

  return html;
}

/* 기존 모달 HTML은 그대로 보존, 새 카드만 admin 데이터로 생성
   originalScript: 원본 슬라이드쇼·게이지 함수 포함 <script> 블록 */
function genModalsPreserving(existingModals, originalScript) {
  const allCards = D.projects.flatMap(grp => grp.cards);
  const pubItems = D.publications || [];

  const projectModals = allCards.map(card => {
    if (existingModals[card.id]) {
      /* 기존 모달 그대로 사용 (이미지·상세내용·슬라이드쇼 유지) */
      return existingModals[card.id];
    }
    /* 새로 추가된 카드: admin 데이터로 생성 */
    return genSingleModal(card);
  });

  const pubModals = pubItems.map(pub => {
    if (existingModals[pub.id]) return existingModals[pub.id];
    return genSinglePublicationModal(pub);
  });

  const modals = projectModals.concat(pubModals).join('\n\n');

  // 원본 스크립트(슬라이드쇼 함수 포함)가 있으면 그대로 사용,
  // 없으면 openModal만 있는 최소 스크립트 사용
  const script = originalScript || genModalScript();
  return modals + '\n' + script;
}

/* 단일 모달 HTML 생성 (새 카드용) */
function genSingleModal(card) {

  const content = (modal.blocks||[]).map(blk => genBlock(blk)).join('\n');
  return `<div class="modal-overlay" id="modal-${card.id}" onclick="closeModal(event,'${card.id}')">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect('${card.id}')">✕</button>
    <h2>${e(card.title)}</h2>
    <div class="modal-period">${e(modal.period||'')}</div>
    <div class="project-tags" style="margin-bottom:1.2rem">
${tags}

    ${content}

</div>`;
}

function genPublications() {

function genSinglePublicationModal(pub) {
  const thumb = pub.thumb ? `<img src="${pub.thumb}" alt="${e(pub.title)}" style="max-width:100%;width:auto;height:auto;max-height:60vh;object-fit:contain;border-radius:12px;margin-bottom:1.4rem;display:block;margin-left:auto;margin-right:auto;background:#f1f5f9;">` : '';

  const link = pub.link ? `<a href="${e(pub.link)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:0.4rem;background:#eff6ff;color:#1d4ed8;padding:0.55rem 1.1rem;border-radius:8px;font-size:0.88rem;font-weight:600;text-decoration:none;border:1.5px solid #bfdbfe;">🔗 자세히 보기</a>` : '';

function genModalScript() {
  return `<script>
function openModal(id) {
  var el = document.getElementById('modal-' + id);
  if (!el) return;
  el.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(event, id) {
  if (event.target === event.currentTarget) closeModalDirect(id);
}
function closeModalDirect(id) {
  var el = document.getElementById('modal-' + id);
  if (el) el.classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(function(el) {
      el.classList.remove('open');
      document.body.style.overflow = '';
    });
  }
});
<\/script>`;
}

/* 하위 호환 — admin 데이터만 있을 때(기존 파일 없이 내보낼 때) 사용 */
function genModals() {
  const modalDivs = D.projects.flatMap(grp => grp.cards).map(card => genSingleModal(card)).join('\n\n');
  return modalDivs + '\n' + genModalScript();
}

function genBlock(blk) {
  if (blk.type === 'subtitle') {
    return `    <p style="font-weight:700;font-size:0.95rem;margin-bottom:0.6rem;color:var(--primary)">${e(blk.text||'')}</p>`;
  }
  if (blk.type === 'paragraph') {
    return `    <p style="margin-bottom:1rem;line-height:1.75;color:#475569;">${e(blk.text||'')}</p>`;
  }
  if (blk.type === 'bullets') {
    const items = (blk.items||[]).map(it => `      <li>${e(it)}</li>`).join('\n');
    return `    <ul style="margin-bottom:1.4rem;padding-left:1.4rem;line-height:1.9;color:#475569;">\n${items}\n    </ul>`;
  }
  if (blk.type === 'image') {
    const capHtml = blk.caption ? `<p style="font-size:0.78rem;color:#94a3b8;margin-top:0.5rem;text-align:center;">${e(blk.caption)}</p>` : '';
    return `    <div style="background:#f1f5f9;border-radius:12px;overflow:hidden;margin-bottom:1.4rem;text-align:center;">
      ${blk.src ? `<img src="${blk.src}" style="max-width:100%;height:auto;display:block;margin:0 auto;" alt="${e(blk.caption||'')}">` : ''}
      ${capHtml}
    </div>`;
  }
  if (blk.type === 'carousel') {
    const imgs = blk.images || [];
    if (imgs.length === 0) return '';
    const uid = 'cs-' + Math.random().toString(36).slice(2,7);
    const slides = imgs.map((img, ii) => {
      const cap = img.caption ? `<p style="font-size:0.78rem;color:#94a3b8;text-align:center;padding:0.4rem 0.8rem;">${e(img.caption)}</p>` : '';
      return `<div style="min-width:100%;"><img src="${img.src}" style="width:100%;height:auto;display:block;" alt="${e(img.caption||'')}">` + cap + `</div>`;
    }).join('\n');
    const btnStyle = `position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.85);border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.15);`;
    const counter = imgs.length > 1 ? `<div id="${uid}-cnt" style="text-align:center;font-size:0.75rem;color:#94a3b8;padding:0.3rem;">1 / ${imgs.length}</div>` : '';
    const btns = imgs.length > 1 ? `
      <button onclick="(function(){var c=document.getElementById('${uid}'),s=parseInt(c.dataset.i||0)-1;if(s<0)s=${imgs.length-1};c.dataset.i=s;c.querySelector('[data-ci]').style.transform='translateX(-'+(s*100)+'%)';var ct=document.getElementById('${uid}-cnt');if(ct)ct.textContent=(s+1)+' / ${imgs.length}';})()" style="${btnStyle}left:6px;">‹</button>
      <button onclick="(function(){var c=document.getElementById('${uid}'),s=parseInt(c.dataset.i||0)+1;if(s>=${imgs.length})s=0;c.dataset.i=s;c.querySelector('[data-ci]').style.transform='translateX(-'+(s*100)+'%)';var ct=document.getElementById('${uid}-cnt');if(ct)ct.textContent=(s+1)+' / ${imgs.length}';})()" style="${btnStyle}right:6px;">›</button>` : '';
    return `    <div id="${uid}" data-i="0" style="position:relative;background:#f1f5f9;border-radius:12px;overflow:hidden;margin-bottom:1.4rem;">
      <div style="overflow:hidden;border-radius:12px 12px 0 0;">
        <div data-ci style="display:flex;transition:transform .4s ease;">${slides}</div>
      </div>
      ${btns}
      ${counter}
    </div>`;
  }
  if (blk.type === 'link') {
    return `    <div style="margin-bottom:1rem;"><a href="${e(blk.href||'#')}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:0.4rem;background:#eff6ff;color:#1d4ed8;padding:0.55rem 1.1rem;border-radius:8px;font-size:0.88rem;font-weight:600;text-decoration:none;border:1.5px solid #bfdbfe;">${e(blk.text||blk.href||'링크')}</a></div>`;
  }
  return '';
}

/* ============================================================
   UTILITIES
   ============================================================ */
function swap(arr, i, j) {
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

/* ============================================================
   INIT
   ============================================================ */
loadFromLocal();
render();
</script>
